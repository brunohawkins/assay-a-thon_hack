# Public digital twin on GitHub Pages.
#
# Builds the ALLOW-LISTED bundle (tools/build_twin_site.py: the twin, only the data files it
# fetches, docs/modules.json; refuses on its confidentiality scan) and deploys it. The repo
# itself stays private; only _site/ is published.
#
# VIDEOS: release assets of a private repo are not publicly readable, so the build downloads
# the `demo-videos` release assets with this workflow's own token and the bundle serves them
# from videos/ (manifest urls rewritten to those site paths). They are public only through
# this site, and never committed. No release yet: the site builds without videos.
#
# NOTHING HERE ENABLES PAGES. Before this can deploy:
#   1. An admin must enable Pages: Settings -> Pages -> Build and deployment -> Source:
#      "GitHub Actions".
#   2. Pages from a PRIVATE repository needs a paid plan (GitHub Pro, Team or Enterprise).
#   3. If that is not available, the fallback is to publish the same _site/ (from
#      `python tools/build_twin_site.py`) to a separate PUBLIC repository with Pages on.
# See docs/videos/README.md.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "twin/**"
      - "chip/**"
      - "protocols/**"
      - "runs/**"
      - "docs/modules.json"
      - "docs/videos/manifest.json"
      - "tools/build_twin_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Downloaded outside _site/ because the build wipes and rewrites _site/.
      - name: Download the demo videos (build time only; tolerates no release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/videos"
          gh release download demo-videos --dir "$RUNNER_TEMP/videos" --clobber \
            || echo "no demo-videos release yet: building without videos"
      - name: Build the allow-listed bundle (prints exactly what goes public)
        run: python tools/build_twin_site.py --out _site --videos "$RUNNER_TEMP/videos"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
