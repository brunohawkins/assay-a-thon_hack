<text x="54.0" y="43.0" font-size="10.5" fill="#5d646d" font-family="Helvetica,Arial,sans-serif">footprint 30 x 20 mm · one fluidic layer, 300 um deep</text>
<text x="54.0" y="56.0" font-size="10.5" fill="#5d646d" font-family="Helvetica,Arial,sans-serif">3 chambers, 6 channels, 6 ports · cut area 73.0 mm2 · blue is cut away (the fluid path), grey is solid</text>
<text x="54.0" y="69.0" font-size="10.5" fill="#5d646d" font-family="Helvetica,Arial,sans-serif">chip</text>
<text x="54.0" y="85.0" font-size="10.5" font-weight="600" fill="#9a3412" font-family="Helvetica,Arial,sans-serif">DEMO SCALE: 30 x 20 mm test article. This is what we can print and emboss today, NOT the device. The</text>
<text x="54.0" y="98.0" font-size="10.5" font-weight="600" fill="#9a3412" font-family="Helvetica,Arial,sans-serif">design target is the ANSI/SLAS microplate footprint 127.76 x 85.48 mm, 18x this area. Do not read any</text>
<text x="54.0" y="111.0" font-size="10.5" font-weight="600" fill="#9a3412" font-family="Helvetica,Arial,sans-serif">dimension on these files as the real device.</text>
