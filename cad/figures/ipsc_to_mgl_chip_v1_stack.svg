  <line x1="50" y1="344" x2="774" y2="344" stroke="#eaeef2" stroke-width="1"/>
  <text x="50" y="362" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">The chamber height IS the fluidic layer: 0.3 mm. That is why every feature shares one embossing depth.</text>
  <text x="50" y="377" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">One process chain: resin-print the tool, hot-emboss the layer. Every feature is one depth, so one tool makes the whole chip.</text>
  <text x="50" y="392" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b949e" text-anchor="start">Floors are from the fabrication review in contracts/blocks.json: open channel 0.2 mm, wall 0.4 mm, port 0.8 mm.</text>
