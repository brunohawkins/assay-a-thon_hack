  <text x="50" y="382" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">One process chain: resin-print the tool, hot-emboss the layer. Every feature is one depth, so one tool makes the whole chip.</text>
  <text x="50" y="397" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b949e" text-anchor="start">Floors are from the fabrication review in contracts/blocks.json: open channel 0.2 mm, wall 0.4 mm, port 0.8 mm.</text>
