  <text x="40" y="390" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b2026" text-anchor="start" font-weight="bold">Smallest feature we have to make: 150 µm. Every in-plane feature clears the printable floors.</text>
  <text x="40" y="406" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">Hollow markers are bought parts. A 5 µm mesh pore is far below any floor too, but nobody has to make it: it arrives as a sheet.</text>
