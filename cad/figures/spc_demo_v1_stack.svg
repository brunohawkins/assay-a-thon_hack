  <text x="490" y="171.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#1f7a6d" text-anchor="middle" font-weight="bold">hot embossing</text>
  <text x="550" y="171.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">tool relief: chamber cavities + channels</text>
