  <polygon points="50,146 84,128 384,128 350,146" fill="#e4edf0" stroke="#7f9aa5" stroke-width="1.1"/>
  <polygon points="350,146 384,128 384,158 350,176" fill="#7f9aa5" stroke="#7f9aa5" stroke-width="1.1" opacity="0.5"/>
