  <text x="490" y="239.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#6e7781" text-anchor="middle" font-weight="bold">stock</text>
  <text x="550" y="239.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">stock sheet, cut to outline only</text>
  <line x1="50" y1="288" x2="774" y2="288" stroke="#eaeef2" stroke-width="1"/>
  <text x="50" y="306" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">The chamber height IS the spacer: 0.15 mm. That is why every feature shares one embossing depth.</text>
  <text x="50" y="321" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">One process: every feature is one embossing depth, so a single tool makes the whole chip. See the feature figure.</text>
  <text x="50" y="336" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b949e" text-anchor="start">Process floors are vendor typicals, not measured: cad/fabrication.json still has laser_kerf_um = null.</text>
</svg>
