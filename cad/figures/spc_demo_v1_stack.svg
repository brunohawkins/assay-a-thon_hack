  <text x="490" y="103.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#6e7781" text-anchor="middle" font-weight="bold">drilling</text>
  <text x="550" y="103.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">cut to outline, ports drilled through</text>
  <line x1="388" y1="106" x2="428" y2="138" stroke="#d6dbe1" stroke-width="1"/>
  <polygon points="50,110 84,92 384,92 350,110" fill="#e4edf0" stroke="#7f9aa5" stroke-width="1.1"/>
  <polygon points="350,110 384,92 384,102 350,120" fill="#7f9aa5" stroke="#7f9aa5" stroke-width="1.1" opacity="0.5"/>
  <rect x="50" y="110" width="300" height="10" fill="#e4edf0" stroke="#7f9aa5" stroke-width="1.1"/>
