  <text x="440" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1b2026" text-anchor="start" font-weight="bold">channels</text>
  <text x="440" y="152" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">coc   ·   0.15 mm</text>
