  <text x="40" y="464" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">Light bar = stage one, solid bar = stage two, hollow dot = the day that lane is seeded. Every lane is fed through its own port, so a lane being seeded cannot reach a lane that is 40 days in.</text>
  <text x="40" y="478" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">Published co-culture work solves the same mismatch the same way: Guttikonda 2021 matures neurons first and adds microglia last; Klimmt 2026 banks frozen intermediates and thaws them into alignment.</text>
