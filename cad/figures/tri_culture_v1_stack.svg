  <text x="490" y="307.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#6e7781" text-anchor="middle" font-weight="bold">stock</text>
  <text x="550" y="307.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">stock sheet, cut to outline only</text>
  <line x1="50" y1="356" x2="774" y2="356" stroke="#eaeef2" stroke-width="1"/>
  <text x="50" y="374" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">The chamber height IS the spacer: 0.3 mm. That is why a chamber is a rectangle in a flat sheet rather than a milled pocket.</text>
  <text x="50" y="389" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#1b2026" text-anchor="start" font-weight="bold">Two processes, not one. 'spacer' goes to the laser cutter; 'grooves' cannot, because its features are microns tall.</text>
  <text x="50" y="404" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5a636d" text-anchor="start">cad/exports/&lt;chip&gt;.dxf keeps them apart: layers CHAMBERS and CHANNELS are the cut path, layer GROOVES is a mask.</text>
  <text x="50" y="419" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b949e" text-anchor="start">Process floors are vendor typicals, not measured: cad/fabrication.json still has laser_kerf_um = null.</text>
</svg>
