  <line x1="40" y1="350" x2="852" y2="350" stroke="#eaeef2" stroke-width="1"/>
  <text x="40" y="364" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="9.5" fill="#1b2026" text-anchor="start" font-weight="bold">Smallest feature we have to make: 300 µm, clear of every floor. One process is enough.</text>
  <text x="40" y="380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#5a636d" text-anchor="start">Hollow markers are bought parts. A 5 µm mesh pore is below the laser floor too, but nobody has to cut it: it arrives as a sheet.</text>
  <text x="40" y="394" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="8.5" fill="#8b949e" text-anchor="start">Floors are vendor/published typicals. cad/fabrication.json has laser_kerf_um = null, so tools/check_chip_spec.py still reports a TODO.</text>
