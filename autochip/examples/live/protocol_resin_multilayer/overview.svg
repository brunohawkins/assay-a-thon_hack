<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 688" width="1240" height="688" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Semi-permeable capsule (SPC) workflow: chip pipeline">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="700" fill="#111827">Semi-permeable capsule (SPC) workflow: chip pipeline</text>
<path d="M274,76 L336,76" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M588,76 L650,76" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="620" y="56" font-size="10" text-anchor="middle" fill="#6b7280">droplets</text>
<text x="620" y="68" font-size="10" text-anchor="middle" fill="#6b7280">(tubing)</text>
<path d="M902,76 L964,76" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="934" y="56" font-size="10" text-anchor="middle" fill="#6b7280">capsules</text>
<text x="934" y="68" font-size="10" text-anchor="middle" fill="#6b7280">(tubing)</text>
<path d="M1091.0,204 L1091.0,479.0 L149.0,479.0 L149.0,512" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="620" y="441" font-size="10" text-anchor="middle" fill="#6b7280">capsules</text>
<text x="620" y="453" font-size="10" text-anchor="middle" fill="#6b7280">(off chip</text>
<text x="620" y="465" font-size="10" text-anchor="middle" fill="#6b7280">step)</text>
<path d="M274,536 L336,536" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M588,536 L650,536" stroke="#6b7280" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="24" y="54" width="250" height="102" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="34" y="74" font-size="13" font-weight="700" fill="#111827">Bench (off chip)</text>
<text x="34" y="100" font-size="11" fill="#6b7280" xml:space="preserve">1. Culture adherent cells in a vessel</text>
<text x="34" y="116" font-size="11" fill="#6b7280" xml:space="preserve">at 37 C with 5% CO2 until confluent,</text>
<text x="34" y="132" font-size="11" fill="#6b7280" xml:space="preserve">changing the medium daily.</text>
<rect x="338" y="54" width="250" height="390" rx="6" fill="#f6f7f9" stroke="#4b5563" stroke-width="1.4"/>
<path d="M339,84 L587,84" stroke="#4b5563" stroke-width="0.8"/>
<text x="348" y="74" font-size="13" font-weight="700" fill="#111827">chip1_rinse_dissociation_quench_wa</text>
<text x="348" y="100" font-size="11" fill="#111827" xml:space="preserve">Cell rinse, dissociation, quench, wash</text>
<text x="348" y="116" font-size="11" fill="#111827" xml:space="preserve">and encapsulation chip</text>
<text x="348" y="132" font-size="11" fill="#111827" xml:space="preserve">culture_1: steps 2, 3</text>
<text x="348" y="148" font-size="11" fill="#6b7280" xml:space="preserve">   culture_chamber_param</text>
<text x="348" y="164" font-size="11" fill="#111827" xml:space="preserve">quench_join: steps 4</text>
<text x="348" y="180" font-size="11" fill="#6b7280" xml:space="preserve">   merge</text>
<text x="348" y="196" font-size="11" fill="#111827" xml:space="preserve">quench_mix: steps 4</text>
<text x="348" y="212" font-size="11" fill="#6b7280" xml:space="preserve">   mixer</text>
<text x="348" y="228" font-size="11" fill="#111827" xml:space="preserve">cell_wash: steps 5, 6</text>
<text x="348" y="244" font-size="11" fill="#6b7280" xml:space="preserve">   spiral_separator</text>
<text x="348" y="260" font-size="11" fill="#111827" xml:space="preserve">core_join: steps 9</text>
<text x="348" y="276" font-size="11" fill="#6b7280" xml:space="preserve">   merge</text>
<text x="348" y="292" font-size="11" fill="#111827" xml:space="preserve">core_mix: steps 9</text>
<text x="348" y="308" font-size="11" fill="#6b7280" xml:space="preserve">   mixer</text>
<text x="348" y="324" font-size="11" fill="#111827" xml:space="preserve">droplets_1: steps 10</text>
<text x="348" y="340" font-size="11" fill="#6b7280" xml:space="preserve">   cross_junction</text>
<text x="348" y="356" font-size="11" fill="#b7791f" xml:space="preserve">missing (step 7): Pillar filter with</text>
<text x="348" y="372" font-size="11" fill="#111827" xml:space="preserve">~30 um gap for cells (0.75 x the 40 um</text>
<text x="348" y="388" font-size="11" fill="#111827" xml:space="preserve">nozzle)</text>
<text x="348" y="404" font-size="11" fill="#6b7280" xml:space="preserve">bench (step 8): Count the cells and</text>
<text x="348" y="420" font-size="11" fill="#111827" xml:space="preserve">check viability.</text>
<rect x="652" y="54" width="250" height="150" rx="6" fill="#f6f7f9" stroke="#4b5563" stroke-width="1.4"/>
<path d="M653,84 L901,84" stroke="#4b5563" stroke-width="0.8"/>
<text x="662" y="74" font-size="13" font-weight="700" fill="#111827">chip2_gelation_emulsion_break_cure</text>
<text x="662" y="100" font-size="11" fill="#111827" xml:space="preserve">Gelation, emulsion breaking, curing</text>
<text x="662" y="116" font-size="11" fill="#111827" xml:space="preserve">and capsule wash chip</text>
<text x="662" y="132" font-size="11" fill="#111827" xml:space="preserve">gelation_delay: steps 11</text>
<text x="662" y="148" font-size="11" fill="#6b7280" xml:space="preserve">   delay_line</text>
<text x="662" y="164" font-size="11" fill="#111827" xml:space="preserve">capsule_trap: steps 12, 13, 14</text>
<text x="662" y="180" font-size="11" fill="#6b7280" xml:space="preserve">   trap_chamber</text>
<rect x="966" y="54" width="250" height="150" rx="6" fill="#f6f7f9" stroke="#4b5563" stroke-width="1.4"/>
<path d="M967,84 L1215,84" stroke="#4b5563" stroke-width="0.8"/>
<text x="976" y="74" font-size="13" font-weight="700" fill="#111827">chip3_filter_lysis_rt_wash</text>
<text x="976" y="100" font-size="11" fill="#111827" xml:space="preserve">Capsule filter, lysis, reverse</text>
<text x="976" y="116" font-size="11" fill="#111827" xml:space="preserve">transcription and wash chip</text>
<text x="976" y="132" font-size="11" fill="#111827" xml:space="preserve">aggregate_filter: steps 15</text>
<text x="976" y="148" font-size="11" fill="#6b7280" xml:space="preserve">   pillar_filter</text>
<text x="976" y="164" font-size="11" fill="#111827" xml:space="preserve">reaction_trap: steps 16, 17, 18, 19</text>
<text x="976" y="180" font-size="11" fill="#6b7280" xml:space="preserve">   trap_chamber</text>
<rect x="24" y="514" width="250" height="118" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="34" y="534" font-size="13" font-weight="700" fill="#111827">Bench (off chip)</text>
<text x="34" y="560" font-size="11" fill="#6b7280" xml:space="preserve">20. Split the capsules into four equal</text>
<text x="34" y="576" font-size="11" fill="#6b7280" xml:space="preserve">portions.</text>
<text x="34" y="592" font-size="11" fill="#6b7280" xml:space="preserve">21. Run index PCR on each portion with</text>
<text x="34" y="608" font-size="11" fill="#6b7280" xml:space="preserve">a different index primer mix.</text>
<rect x="338" y="514" width="250" height="150" rx="6" fill="#f6f7f9" stroke="#4b5563" stroke-width="1.4"/>
<path d="M339,544 L587,544" stroke="#4b5563" stroke-width="0.8"/>
<text x="348" y="534" font-size="13" font-weight="700" fill="#111827">chip4_shell_release_bead_capture_w</text>
<text x="348" y="560" font-size="11" fill="#111827" xml:space="preserve">Shell release, bead capture, ethanol</text>
<text x="348" y="576" font-size="11" fill="#111827" xml:space="preserve">wash and elution chip</text>
<text x="348" y="592" font-size="11" fill="#111827" xml:space="preserve">release_trap: steps 22</text>
<text x="348" y="608" font-size="11" fill="#6b7280" xml:space="preserve">   trap_chamber</text>
<text x="348" y="624" font-size="11" fill="#111827" xml:space="preserve">beads_1: steps 23, 24, 25</text>
<text x="348" y="640" font-size="11" fill="#6b7280" xml:space="preserve">   magnetic_chamber</text>
<rect x="652" y="514" width="250" height="86" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="662" y="534" font-size="13" font-weight="700" fill="#111827">Bench (off chip)</text>
<text x="662" y="560" font-size="11" fill="#6b7280" xml:space="preserve">26. Measure library concentration and</text>
<text x="662" y="576" font-size="11" fill="#6b7280" xml:space="preserve">fragment size.</text>
</svg>
